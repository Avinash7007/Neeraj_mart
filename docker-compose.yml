version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=staging_password
      - DB_NAME=commerce_app
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=staging_password
      - MYSQL_DATABASE=commerce_app
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
